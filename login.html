<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Kerupuk Bantal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
    <div class="container">
      <a class="navbar-link navbar-brand fw-bold" href="index.html">🔥 Kerupuk Bantal Pedas Manis</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="produk.html">Katalog Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="profil.html">Profil Usaha</a></li>
          <li class="nav-item"><a class="nav-link active btn btn-outline-light text-white ms-lg-2 px-3" href="login.html">Login Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Login Section -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0 rounded-3">
          <div class="card-body p-4">
            <h3 class="card-title text-center fw-bold text-danger mb-4">Login Pengelola</h3>

            <!-- Container Alert Pesan Validasi -->
            <div id="alertContainer"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label font-weight-bold">Email / Username</label>
                <input type="email" class="form-control" id="email" placeholder="Masukkan email anda">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label font-weight-bold">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter">
              </div>

              <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2026 UMKM Kerupuk Bantal Pedas Manis. Tugas UTS Pemrograman Web.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript Validasi -->
  <script src="js/login.js"></script>
</body>
</html>
